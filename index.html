<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>تأويل — تفسير الأحلام</title>
<meta name="theme-color" content="#0a0d24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  :root{
    --bg: #0a0d24;
    --panel: #141938;
    --gold: #c9a24a;
    --teal: #3fa79b;
    --text: #f0ead9;
    --text-dim: #a8aed4;
    --border: rgba(201,162,74,0.2);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; padding:16px;
    background: radial-gradient(800px 400px at 50% 0%, rgba(201,162,74,0.12), transparent 70%), var(--bg);
    color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh;
  }
  .app-header{text-align:center; padding:10px 0 15px;}
  .app-header h1{font-family:'Amiri',serif; font-size:32px; color:var(--gold); margin:0;}
  .app-header p{font-size:13px; color:var(--text-dim); margin:4px 0 0;}

  .card{
    background:var(--panel); border:1px solid var(--border);
    border-radius:16px; padding:18px; margin-bottom:16px;
  }
  
  label{display:block; font-weight:700; margin-bottom:8px; font-size:14px; color:var(--gold);}
  textarea{
    width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.15);
    color:var(--text); border-radius:12px; padding:14px; font-family:'Tajawal',sans-serif;
    font-size:15px; outline:none; min-height:140px; resize:none; line-height:1.6;
  }
  textarea:focus{border-color:var(--gold);}

  .btn-submit{
    width:100%; margin-top:12px;
    background:linear-gradient(90deg,var(--gold),#e0bd6f); color:#1a1206;
    border:none; padding:15px; border-radius:12px; font-family:'Tajawal',sans-serif;
    font-weight:700; font-size:16px; cursor:pointer;
    box-shadow:0 8px 20px -4px rgba(201,162,74,0.4);
  }

  .loading{display:none; text-align:center; padding:20px 0;}
  .spinner{width:36px; height:36px; margin:0 auto 10px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #resultArea{display:none;}
  .result-card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:20px; line-height:1.8; font-size:15px;
  }
  .result-card h2{font-family:'Amiri',serif; color:var(--gold); border-bottom:1px solid var(--border); padding-bottom:8px; margin-top:0;}
  .result-card h3{color:var(--teal); margin-top:16px;}
  .result-card ul{padding-right:18px;}
</style>
</head>
<body>

<div class="app-header">
  <h1>تأويل — تفسير الأحلام</h1>
  <p>المُحلل الذكي المباشر لرموز الرؤى</p>
</div>

<div class="card">
  <label for="dreamInput">اكتب تفاصيل الحلم (ومعه أي معلومات كالعمر أو الظروف):</label>
  <textarea id="dreamInput" placeholder="اكتب حلمك بالتفصيل هنا..."></textarea>
  <button class="btn-submit" onclick="analyzeDream()">تفسير الحلم الآن</button>

  <div class="loading" id="loadingView">
    <div class="spinner"></div>
    <div>جاري تحليل الرموز واستقراء التفسير العميق...</div>
  </div>
</div>

<div id="resultArea">
  <div class="card result-card" id="resultCard"></div>
</div>

<script>
async function analyzeDream() {
  const dreamText = document.getElementById('dreamInput').value.trim();
  if(!dreamText) {
    alert("يرجى كتابة نص الحلم أولاً.");
    return;
  }

  document.getElementById('loadingView').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';

  // ملاحظة: لربط التفسير الذكي الحقيقي لجميع المستخدمين، 
  // يتم الاتصال بسيرفر الوسيط (Proxy) ليمرر الطلب مع المفتاح بأمان.
  const prompt = `أنت خبير كبار مفسري الأحلام وتعبير الرؤى وفق المناهج التراثية والتحليل النفسي. المطلوب منك تقديم تفسير معمق، احترافي، ودقيق للحلم أدناه:
"${dreamText}"

التنسيق:
## التعبير والتأويل العميق
### 1. تفكيك الرموز الرئيسية
### 2. الربط بالواقع والنفسية
### 3. الخلاصة والتوجيه`;

  try {
    // يستدعي API المباشر لـ Gemini
    const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=ضع_مفتاح_API_هنا", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });

    const data = await response.json();
    if(data.candidates && data.candidates[0].content.parts[0].text) {
      document.getElementById('resultCard').innerHTML = marked.parse(data.candidates[0].content.parts[0].text);
      document.getElementById('resultArea').style.display = 'block';
    } else {
      throw new Error("خطأ في معالجة الطلب");
    }
  } catch(err) {
    alert("تعذر جلب التفسير حالياً، يرجى المحاولة لاحقاً.");
  } finally {
    document.getElementById('loadingView').style.display = 'none';
  }
}
</script>
</body>
</html>
