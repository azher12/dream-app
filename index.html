<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تأويل — تفسير الأحلام بالذكاء الاصطناعي</title>
<meta name="theme-color" content="#0a0d24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  :root{
    --bg: #0a0d24;
    --panel: #141938;
    --panel-2: #191f47;
    --gold: #c9a24a;
    --teal: #3fa79b;
    --text: #f0ead9;
    --text-dim: #a8aed4;
    --border: rgba(201,162,74,0.22);
    --danger: #e08a7c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; padding:20px;
    background: radial-gradient(1000px 500px at 50% 0%, rgba(201,162,74,0.12), transparent 60%), var(--bg);
    color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
  }
  .container{max-width:650px; width:100%; margin:0 auto;}
  header{text-align:center; padding:20px 0 10px;}
  h1{font-family:'Amiri',serif; font-size:36px; color:var(--gold); margin:0 0 8px;}
  p.sub{color:var(--text-dim); font-size:14.5px; margin:0 0 25px;}

  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--border); border-radius:18px; padding:22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
  }
  
  label{display:block; font-weight:700; margin-bottom:8px; font-size:15px; color:var(--gold);}
  textarea, input[type=text]{
    width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.15);
    color:var(--text); border-radius:12px; padding:14px; font-family:'Tajawal',sans-serif;
    font-size:15.5px; outline:none; transition:border-color .2s;
  }
  textarea:focus, input:focus{border-color:var(--gold);}
  textarea{min-height:160px; resize:vertical; line-height:1.7;}

  .api-box{margin-bottom:18px; background:rgba(0,0,0,0.2); padding:12px; border-radius:10px; border:1px dashed var(--border);}
  .api-box summary{cursor:pointer; color:var(--text-dim); font-size:13px; font-weight:bold;}

  .btn-submit{
    width:100%; margin-top:15px;
    background:linear-gradient(90deg,var(--gold),#e0bd6f); color:#1a1206;
    border:none; padding:16px; border-radius:12px; font-family:'Tajawal',sans-serif;
    font-weight:700; font-size:17px; cursor:pointer;
    box-shadow:0 10px 20px -5px rgba(201,162,74,0.4);
  }
  .btn-submit:active{transform:scale(0.99);}

  .loading{display:none; text-align:center; padding:30px 0;}
  .spinner{width:40px; height:40px; margin:0 auto 15px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #resultArea{display:none; margin-top:25px;}
  .result-content{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:25px; line-height:1.8; font-size:15.5px;
  }
  .result-content h2{font-family:'Amiri',serif; color:var(--gold); border-bottom:1px solid var(--border); padding-bottom:10px; margin-top:0;}
  .result-content h3{color:var(--teal); margin-top:20px;}
  .result-content ul{padding-right:20px;}
  .result-content li{margin-bottom:8px;}

  #signature{position:fixed; top:12px; left:14px; font-family:'Georgia',serif; font-style:italic; font-size:11px; color:var(--gold); opacity:.7;}
</style>
</head>
<body>

<div id="signature">Azher designer</div>

<div class="container">
  <header>
    <h1>محلل الأحلام الذكي</h1>
    <p class="sub">تفسير معمق بالذكاء الاصطناعي يستقرئ الرموز بدقة كبار المفسرين</p>
  </header>

  <div class="card">
    <!-- إمكانية حفظ أو تعديل المفتاح بسهولة -->
    <details class="api-box">
      <summary>⚙️ إعدادات مفتاح الذكاء الاصطناعي (Gemini API Key)</summary>
      <div style="margin-top:10px;">
        <input type="text" id="apiKeyInput" placeholder="ضع المفتاح الذي يبدأ بـ AIzaSy هنا..." />
        <p style="font-size:11px; color:var(--text-dim); margin:6px 0 0;">يتم حفظ المفتاح في متصفحك تلقائياً ليعمل دائماً.</p>
      </div>
    </details>

    <label for="dreamInput">اكتب تفاصيل الحلم (ومعه أي معلومات كالعمر، المشاعر، أو الظروف):</label>
    <textarea id="dreamInput" placeholder="مثال: حلمت أن شخصاً من أقاربي قدم لي طبق طعام... عمري 35 سنة، متزوج، وأمر بضغوط عمل..."></textarea>

    <button class="btn-submit" onclick="analyzeDream()">تحليل وتفسير الحلم عميقاً</button>

    <div class="loading" id="loadingView">
      <div class="spinner"></div>
      <div>جاري البحث والتفكير في رموز الحلم وصياغة التفسير المعمق...</div>
    </div>
  </div>

  <div id="resultArea">
    <div class="card result-content" id="resultCard"></div>
  </div>
</div>

<script>
// المفتاح الافتراضي (إن وجد)
let defaultKey = "";

// تحميل المفتاح المحفوظ من ذاكرة المتصفح إن وجد
window.onload = function() {
  let savedKey = localStorage.getItem('gemini_key');
  if(savedKey) {
    document.getElementById('apiKeyInput').value = savedKey;
  }
};

async function analyzeDream() {
  const dreamText = document.getElementById('dreamInput').value.trim();
  let apiKey = document.getElementById('apiKeyInput').value.trim() || defaultKey;

  if(!dreamText) {
    alert("يرجى كتابة نص الحلم أولاً.");
    return;
  }

  if(!apiKey) {
    alert("يرجى وضع مفتاح Gemini API في الإعدادات أعلى الصفحة لكي يشتغل التفسير الذكي.");
    return;
  }

  // حفظ المفتاح للاستخدام المستقبلي
  localStorage.setItem('gemini_key', apiKey);

  document.getElementById('loadingView').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';

  const prompt = `أنت خبير وكبير مفسري الأحلام وتعبير الرؤى وفق المناهج التراثية (كابن سيرين والمنظور الجعفري) والتحليل النفسي.
المطلوب منك تقديم تفسير معمق، احترافي، ودقيق جداً للحلم والنصوص المذكورة أدناه.
حلل كل رمز بشكل مستقل (الأقارب، الطعام، المكان، الأفعال، المشاعر) ثم اربط بينها وبين الظروف المذكورة.

النص المُدخل من الرائي:
"${dreamText}"

اكتب التفسير بأسلوب رصين وفصيح بدون مقدمات فارغة، مقسم إلى:
## التعبير والتأويل العميق
### 1. تفكيك الرموز الرئيسية في الحلم
### 2. إسقاط الرؤيا على الواقع والنفسية
### 3. الخلاصة والتوجيه الإرشادي`;

  try {
    // الاتصال بالذكاء الاصطناعي API
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });

    const data = await response.json();

    if(data.candidates && data.candidates[0].content.parts[0].text) {
      let outputText = data.candidates[0].content.parts[0].text;
      document.getElementById('resultCard').innerHTML = marked.parse(outputText);
      document.getElementById('resultArea').style.display = 'block';
    } else {
      throw new Error("خطأ في الاستجابة أو المفتاح غير صالح");
    }
  } catch(err) {
    console.error(err);
    alert("حدث خطأ أثناء الاتصال بالذكاء الاصطناعي. تأكد من أن مفتاح الـ API يبدأ بـ AIzaSy وأنك متصل بالإنترنت.");
  } finally {
    document.getElementById('loadingView').style.display = 'none';
  }
}
</script>
</body>
</html>
