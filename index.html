<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تأويل — تفسير الأحلام الاحترافي</title>
<meta name="theme-color" content="#0a0d24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  :root {
    --bg: #0a0d24;
    --panel: #141938;
    --gold: #c9a24a;
    --teal: #3fa79b;
    --text: #f0ead9;
    --text-dim: #a8aed4;
    --border: rgba(201,162,74,0.22);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px;
    background: radial-gradient(900px 450px at 50% 0%, rgba(201,162,74,0.12), transparent 70%), var(--bg);
    color: var(--text); font-family: 'Tajawal', sans-serif; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .app-container { max-width: 600px; width: 100%; margin: 0 auto; }
  header { text-align: center; padding: 16px 0 20px; }
  h1 { font-family: 'Amiri', serif; font-size: 34px; color: var(--gold); margin: 0 0 6px; }
  p.sub { color: var(--text-dim); font-size: 13.5px; margin: 0; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 18px; padding: 22px; box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  }
  
  label { display: block; font-weight: 700; margin-bottom: 10px; font-size: 15px; color: var(--gold); }
  textarea {
    width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.15);
    color: var(--text); border-radius: 14px; padding: 15px; font-family: 'Tajawal', sans-serif;
    font-size: 15.5px; outline: none; min-height: 160px; resize: none; line-height: 1.7;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--gold); }

  .btn-submit {
    width: 100%; margin-top: 16px;
    background: linear-gradient(90deg, var(--gold), #e0bd6f); color: #1a1206;
    border: none; padding: 16px; border-radius: 12px; font-family: 'Tajawal', sans-serif;
    font-weight: 700; font-size: 16.5px; cursor: pointer;
    box-shadow: 0 8px 20px -4px rgba(201,162,74,0.4);
  }
  .btn-submit:active { transform: scale(0.98); }

  .loading { display: none; text-align: center; padding: 25px 0 10px; }
  .spinner { width: 38px; height: 38px; margin: 0 auto 12px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #resultArea { display: none; margin-top: 20px; }
  .result-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 24px; line-height: 1.85; font-size: 15.5px;
  }
  .result-card h2 { font-family: 'Amiri', serif; color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-top: 0; }
  .result-card h3 { color: var(--teal); margin-top: 20px; font-size: 18px; }
  .result-card ul, .result-card ol { padding-right: 20px; margin: 10px 0; }
  .result-card li { margin-bottom: 10px; }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>تأويل — تفسير الأحلام</h1>
    <p class="sub">المحرك الاحترافي المباشر لتحليل الرؤى بالذكاء الاصطناعي</p>
  </header>

  <div class="card">
    <label for="dreamInput">اكتب تفاصيل الحلم (مع المعطيات الشخصية):</label>
    <textarea id="dreamInput" placeholder="اكتب الحلم كاملاً هنا..."></textarea>
    <button class="btn-submit" onclick="sendDream()">تفسير الحلم الآن</button>

    <div class="loading" id="loadingView">
      <div class="spinner"></div>
      <div>جاري معالجة الرموز والتأويل عبر السيرفر...</div>
    </div>
  </div>

  <div id="resultArea">
    <div class="card result-card" id="resultCard"></div>
  </div>
</div>

<script>
async function sendDream() {
  const dreamText = document.getElementById('dreamInput').value.trim();
  if (!dreamText) {
    alert("يرجى كتابة نص الحلم أولاً.");
    return;
  }

  document.getElementById('loadingView').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';

  try {
    // الاتصال برابط السيرفر الداخلي
    const response = await fetch('/api/interpret', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dreamText: dreamText })
    });

    const data = await response.json();

    if (data.result) {
      document.getElementById('resultCard').innerHTML = marked.parse(data.result);
      document.getElementById('resultArea').style.display = 'block';
    } else {
      alert(data.error || "حدث خطأ أثناء معالجة الطلب");
    }
  } catch (error) {
    alert("تعذر الاتصال بالسيرفر. تأكد من أن السيرفر يعمل وبصلة بالإنترنت.");
  } finally {
    document.getElementById('loadingView').style.display = 'none';
  }
}
</script>
</body>
</html>
