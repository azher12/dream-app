<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>تأويل — تفسير الأحلام بالذكاء الاصطناعي</title>
<meta name="theme-color" content="#0a0d24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<!-- مكتبة تنسيق النصوص الحرة -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  :root{
    --bg: #0a0d24;
    --panel: #141938;
    --gold: #c9a24a;
    --teal: #3fa79b;
    --text: #f0ead9;
    --text-dim: #a8aed4;
    --border: rgba(201,162,74,0.22);
    --danger: #e08a7c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; padding:16px;
    background: radial-gradient(900px 450px at 50% 0%, rgba(201,162,74,0.12), transparent 70%), var(--bg);
    color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
  }
  .app-container{max-width:600px; width:100%; margin:0 auto;}
  header{text-align:center; padding:16px 0 20px;}
  h1{font-family:'Amiri',serif; font-size:34px; color:var(--gold); margin:0 0 6px;}
  p.sub{color:var(--text-dim); font-size:13.5px; margin:0;}

  .card{
    background:var(--panel); border:1px solid var(--border);
    border-radius:18px; padding:22px; box-shadow:0 10px 25px rgba(0,0,0,0.35);
  }
  
  label{display:block; font-weight:700; margin-bottom:10px; font-size:15px; color:var(--gold);}
  textarea{
    width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.15);
    color:var(--text); border-radius:14px; padding:15px; font-family:'Tajawal',sans-serif;
    font-size:15.5px; outline:none; min-height:160px; resize:none; line-height:1.7;
    transition:border-color .2s;
  }
  textarea:focus{border-color:var(--gold);}

  .btn-submit{
    width:100%; margin-top:16px;
    background:linear-gradient(90deg,var(--gold),#e0bd6f); color:#1a1206;
    border:none; padding:16px; border-radius:12px; font-family:'Tajawal',sans-serif;
    font-weight:700; font-size:16.5px; cursor:pointer;
    box-shadow:0 8px 20px -4px rgba(201,162,74,0.4);
    transition:transform .1s ease;
  }
  .btn-submit:active{transform:scale(0.98);}

  .loading{display:none; text-align:center; padding:25px 0 10px;}
  .spinner{width:38px; height:38px; margin:0 auto 12px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #resultArea{display:none; margin-top:20px;}
  .result-card{
    background:var(--panel); border:1px solid var(--border); border-radius:18px;
    padding:24px; line-height:1.85; font-size:15.5px;
  }
  .result-card h2{font-family:'Amiri',serif; color:var(--gold); border-bottom:1px solid var(--border); padding-bottom:10px; margin-top:0;}
  .result-card h3{color:var(--teal); margin-top:20px; font-size:18px;}
  .result-card ul, .result-card ol{padding-right:20px; margin:10px 0;}
  .result-card li{margin-bottom:10px;}
  .result-card blockquote{
    background:rgba(201,162,74,0.08); border-right:3px solid var(--gold);
    padding:12px 16px; margin:15px 0; border-radius:6px;
  }

  #signature{position:fixed; top:12px; left:14px; font-family:'Georgia',serif; font-style:italic; font-size:11px; color:var(--gold); opacity:.7;}
</style>
</head>
<body>

<div id="signature">Azher designer</div>

<div class="app-container">
  <header>
    <h1>تأويل — تفسير الأحلام</h1>
    <p class="sub">تفسير واستقراء رمزي بالذكاء الاصطناعي المباشر</p>
  </header>

  <div class="card">
    <label for="dreamInput">اكتب تفاصيل الحلم (ومعه العمر والظروف إن وجدتا):</label>
    <textarea id="dreamInput" placeholder="مثال: حلمت أن شخصاً من أقاربي قدم لي طبق طعام... عمري 35 سنة، متزوج..."></textarea>
    <button class="btn-submit" onclick="analyzeDreamNoKey()">تفسير الحلم بالذكاء الاصطناعي</button>

    <div class="loading" id="loadingView">
      <div class="spinner"></div>
      <div id="statusText">جاري الاتصال بمحرك الذكاء الاصطناعي لتفكيك الرموز...</div>
    </div>
  </div>

  <div id="resultArea">
    <div class="card result-card" id="resultCard"></div>
  </div>
</div>

<script>
async function analyzeDreamNoKey() {
  const dreamText = document.getElementById('dreamInput').value.trim();
  if(!dreamText) {
    alert("يرجى كتابة نص الحلم أولاً.");
    return;
  }

  document.getElementById('loadingView').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';

  const promptText = `أنت خبير وكبير مفسري الأحلام وتعبير الرؤى وفق المناهج التراثية والتحليل النفسي.
المطلوب منك تقديم تفسير معمق، احترافي، ودقيق جداً للحلم والنصوص المذكورة أدناه.
حلل كل رمز بشكل مستقل (الأشخاص، الأفعال، الأطعمة، الأماكن، المشاعر) ثم اربط بينها وبين الظروف المذكورة.

النص المُدخل من الرائي:
"${dreamText}"

التنسيق المطلوب للإجابة (اكتب بلغة عربية فصيحة ورصينة):
## التعبير والتأويل العميق
### 1. تفكيك الرموز الرئيسية في الحلم
### 2. إسقاط الرؤيا على الواقع والنفسية
### 3. الخلاصة والتوجيه الإرشادي`;

  try {
    // استدعاء محرك الذكاء الاصطناعي المفتوح والمجاني عبر خادم DuckDuckGo AI / Pollinations السريع وبدون أي مفتاح
    const response = await fetch("https://text.pollinations.ai/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: [
          { role: "system", content: "أنت مفسر أحلام خبير ورصين جداً تتبع نهج التعبير التراثي والتحليلي." },
          { role: "user", content: promptText }
        ],
        model: "openai",
        jsonMode: false
      })
    });

    if (!response.ok) {
      throw new Error("شبكة الذكاء الاصطناعي مشغولة حالياً");
    }

    const resultText = await response.text();

    if(resultText && resultText.length > 20) {
      document.getElementById('resultCard').innerHTML = marked.parse(resultText);
      document.getElementById('resultArea').style.display = 'block';
    } else {
      throw new Error("لم يتم تلقي تحليل مكتمل");
    }

  } catch(err) {
    console.error(err);
    alert("تعذر جلب التفسير حالياً، يرجى التأكد من الاتصال بالإنترنت والمحاولة مجدداً.");
  } finally {
    document.getElementById('loadingView').style.display = 'none';
  }
}
</script>
</body>
</html>
